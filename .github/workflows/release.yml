name: Approved release
run-name: Release ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Approved version matching VERSION, without v prefix"
        required: true
        type: string
permissions:
  actions: read
  contents: write
  packages: write
concurrency:
  group: scopearr-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate version and reject existing releases
        shell: bash
        run: |
          node scripts/check-version.mjs --release
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo 'Version tag already exists; choose a new version.'
            exit 1
          fi
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      - run: pnpm --dir web audit --audit-level=moderate
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go test -race ./... && go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 '-checks=all,-ST*' ./...
      - run: GOMAXPROCS=2 SCOPEARR_PERF=1 go test -run TestPerformance50K -count=1 -v ./internal/app
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}
            SOURCE=https://github.com/${{ github.repository }}
      - name: Smoke-test both architectures
        run: |
          for arch in amd64 arm64; do
            docker pull --platform "linux/$arch" "$IMAGE:$VERSION"
            docker run -d --read-only --cap-drop ALL --security-opt no-new-privileges --memory 512m --memory-swap 512m --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m --platform "linux/$arch" --name "scopearr-$arch" -e SCOPEARR_DEMO=true "$IMAGE:$VERSION"
            for n in $(seq 1 60); do
              if docker exec "scopearr-$arch" scopearr healthcheck; then break; fi
              sleep 1
            done
            docker exec "scopearr-$arch" scopearr healthcheck
            docker rm -f "scopearr-$arch"
            docker save "$IMAGE:$VERSION" -o "$RUNNER_TEMP/scopearr-$arch.tar"
            docker run --rm -v "$RUNNER_TEMP/scopearr-$arch.tar:/scan/image.tar:ro" -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --input /scan/image.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1
          done
      - name: 100k synthetic files with Emby without swap
        run: |
          docker pull --platform linux/amd64 "$IMAGE:$VERSION"
          python3 docs/scripts/containercheck.py --jellyfin --named-instances --image "$IMAGE:$VERSION"
      - name: Require successful Main CI for this commit
        run: python3 scripts/check-release-ci.py
      - name: Publish version and release notes
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Scopearr $VERSION" --notes-file "docs/releases/$VERSION.md"
      - name: Promote approved image to stable
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:stable" "$IMAGE@$DIGEST"

