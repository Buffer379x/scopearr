name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: node scripts/check-version.mjs
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      - run: pnpm --dir web audit --audit-level=moderate
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 '-checks=all,-ST*' ./...
      - name: 50k file performance check
        run: GOMAXPROCS=2 SCOPEARR_PERF=1 go test -run TestPerformance50K -count=1 -v ./internal/app
      - name: Docker build and smoke test
        run: |
          docker build -t scopearr:test .
          docker run -d --read-only --cap-drop ALL --security-opt no-new-privileges --memory 512m --memory-swap 512m --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m --name scopearr-ci -e SCOPEARR_DEMO=true scopearr:test
          for n in $(seq 1 30); do
            if docker exec scopearr-ci scopearr healthcheck; then break; fi
            sleep 1
          done
          docker exec scopearr-ci scopearr healthcheck
          test "$(docker inspect --format '{{.Config.User}}' scopearr-ci)" = '99:100'
          docker stop scopearr-ci
          docker start scopearr-ci
          sleep 2
          docker exec scopearr-ci scopearr healthcheck
          docker rm -f scopearr-ci
      - name: Optional signed MKVToolNix install and real remux
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/mux-appdata"
          sudo chown 99:100 "$RUNNER_TEMP/mux-appdata"
          docker run --rm --user 99:100 --read-only --cap-drop ALL --security-opt no-new-privileges --memory 512m --memory-swap 512m --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m -v "$RUNNER_TEMP/mux-appdata:/data" -v "$PWD/scripts/check-mkvtoolnix.sh:/check.sh:ro" -v "$PWD/internal/app/testdata/mux120.wav:/fixture.wav:ro" --entrypoint sh scopearr:test /check.sh
      - name: Scan runtime image for high and critical vulnerabilities
        run: |
          docker save scopearr:test -o "$RUNNER_TEMP/scopearr-image.tar"
          docker run --rm -v "$RUNNER_TEMP/scopearr-image.tar:/scan/image.tar:ro" aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa image --input /scan/image.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1
      - name: 100k synthetic files with Emby, no swap, cached dashboard
        run: python3 docs/scripts/containercheck.py --jellyfin --named-instances --image scopearr:test
